# =====================================================================
# H2 In-Memory Profile Configuration for Automated Tests & Local Demo
# =====================================================================

spring.datasource.url=jdbc:h2:mem:student_event_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.admin.fullname=System Administrator
app.admin.email=admin@college.edu
app.admin.password=Admin@123
app.data.seed-sample-data=true
