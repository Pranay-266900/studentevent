# =====================================================================
# Student Event Registration & Participation System - Configuration
# =====================================================================

spring.application.name=student-event-system

# Server Configuration (Render binds to $PORT dynamically)
server.port=${PORT:8080}
server.servlet.context-path=

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_event_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Resource Handling (Frontend served by Spring Boot)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# Initial Admin Credentials (configurable via env vars)
app.admin.fullname=${APP_ADMIN_FULLNAME:System Administrator}
app.admin.email=${APP_ADMIN_EMAIL:admin@college.edu}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# Seed Sample Data on Startup if Database is Empty
app.data.seed-sample-data=${APP_DATA_SEED:true}

# Session Management (Configurable for cross-site Vercel <-> Render deployments)
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=SESSSESSIONID
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
