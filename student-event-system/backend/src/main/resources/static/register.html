<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CampusEventHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6 col-xl-5">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <div class="stat-icon bg-success text-white rounded-3 mx-auto mb-3" style="width: 54px; height: 54px;">
                                    <i class="bi bi-person-plus-fill fs-3"></i>
                                </div>
                                <h3 class="fw-bold mb-1">Create an Account</h3>
                                <p class="text-muted small">Register as a student or event organizer</p>
                            </div>

                            <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>

                            <form id="register-form">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">I want to register as</label>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="radio" class="btn-check" name="role" id="role-student" value="STUDENT" checked>
                                            <label class="btn btn-outline-primary w-100 py-2" for="role-student">
                                                <i class="bi bi-backpack4 me-1"></i> Student
                                            </label>
                                        </div>
                                        <div class="col-6">
                                            <input type="radio" class="btn-check" name="role" id="role-organizer" value="ORGANIZER">
                                            <label class="btn btn-outline-success w-100 py-2" for="role-organizer">
                                                <i class="bi bi-calendar-event me-1"></i> Organizer
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="fullName" class="form-label small fw-semibold">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="fullName" required placeholder="e.g. John Doe">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label small fw-semibold">College Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" required placeholder="student@college.edu">
                                    </div>
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col-sm-6">
                                        <label for="password" class="form-label small fw-semibold">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" id="password" required minlength="6" placeholder="Min 6 chars">
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                                            <input type="password" class="form-control" id="confirmPassword" required minlength="6" placeholder="Re-enter">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                    <label class="form-check-label small text-muted" for="agreeTerms">
                                        I agree to follow the college event code of conduct
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="submit-btn">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="register-spinner"></span>
                                    Complete Registration
                                </button>
                            </form>

                            <div class="text-center mt-4">
                                <p class="text-muted small mb-0">Already have an account?
                                    <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            &copy; 2026 CampusEventHub - Student Event Registration & Participation System
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar('register');

            // Handle query param for role
            const params = new URLSearchParams(window.location.search);
            if (params.get('role') === 'ORGANIZER') {
                document.getElementById('role-organizer').checked = true;
            }

            const form = document.getElementById('register-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const alertBox = document.getElementById('register-alert');
                alertBox.classList.add('d-none');

                const fullName = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const role = document.querySelector('input[name="role"]:checked').value;

                if (password !== confirmPassword) {
                    alertBox.textContent = 'Passwords do not match. Please re-enter.';
                    alertBox.classList.remove('d-none');
                    return;
                }

                const spinner = document.getElementById('register-spinner');
                const submitBtn = document.getElementById('submit-btn');

                spinner.classList.remove('d-none');
                submitBtn.disabled = true;

                try {
                    const res = await API.post('/auth/register', {
                        fullName,
                        email,
                        password,
                        role
                    });

                    if (res && res.user) {
                        Auth.setUser(res.user);
                        App.showToast('Account created successfully!', 'success');
                        setTimeout(() => {
                            if (res.user.role === 'ORGANIZER') {
                                window.location.href = 'organizer-dashboard.html';
                            } else {
                                window.location.href = 'student-dashboard.html';
                            }
                        }, 600);
                    }
                } catch (err) {
                    alertBox.textContent = err.message || 'Registration failed. Please check inputs.';
                    alertBox.classList.remove('d-none');
                } finally {
                    spinner.classList.add('d-none');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
