<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusEventHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <main class="py-4">
        <div class="container-xl">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">My Account Profile</h2>
                            <p class="text-muted mb-0">Update personal information and account security</p>
                        </div>
                    </div>

                    <div id="profile-alert" class="alert alert-danger d-none" role="alert"></div>

                    <div class="card shadow-sm border-0 rounded-4 mb-4">
                        <div class="card-body p-4">
                            <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                                <div class="stat-icon bg-primary text-white rounded-circle fs-3" style="width: 56px; height: 56px;">
                                    <i class="bi bi-person"></i>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-0" id="profile-display-name">-</h5>
                                    <span class="badge bg-primary text-uppercase" id="profile-display-role">-</span>
                                </div>
                            </div>

                            <form id="profile-form">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email Address (Read-Only)</label>
                                    <input type="email" class="form-control bg-light" id="profile-email" readonly disabled>
                                </div>

                                <div class="mb-3">
                                    <label for="profile-name" class="form-label small fw-semibold">Full Name *</label>
                                    <input type="text" class="form-control" id="profile-name" required maxlength="100">
                                </div>

                                <hr class="my-4">
                                <h6 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2 text-primary"></i>Change Password (Optional)</h6>

                                <div class="mb-3">
                                    <label for="current-password" class="form-label small fw-semibold">Current Password</label>
                                    <input type="password" class="form-control" id="current-password" placeholder="Leave blank if not changing">
                                </div>

                                <div class="mb-4">
                                    <label for="new-password" class="form-label small fw-semibold">New Password</label>
                                    <input type="password" class="form-control" id="new-password" minlength="6" placeholder="Min 6 characters">
                                </div>

                                <button type="submit" class="btn btn-primary w-100 fw-semibold" id="save-profile-btn">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="profile-spinner"></span>
                                    Save Profile Changes
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            &copy; 2026 CampusEventHub - Student Event Registration & Participation System
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth()) return;
            Auth.renderNavbar('profile');

            const user = Auth.getUser();
            if (user) {
                document.getElementById('profile-display-name').textContent = user.fullName;
                document.getElementById('profile-display-role').textContent = user.role;
                document.getElementById('profile-email').value = user.email;
                document.getElementById('profile-name').value = user.fullName;
            }

            const form = document.getElementById('profile-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const alertBox = document.getElementById('profile-alert');
                alertBox.classList.add('d-none');

                const fullName = document.getElementById('profile-name').value.trim();
                const currentPassword = document.getElementById('current-password').value;
                const newPassword = document.getElementById('new-password').value;

                if (newPassword && !currentPassword) {
                    alertBox.textContent = 'Please enter your current password to authorize password update.';
                    alertBox.classList.remove('d-none');
                    return;
                }

                const spinner = document.getElementById('profile-spinner');
                const btn = document.getElementById('save-profile-btn');
                spinner.classList.remove('d-none');
                btn.disabled = true;

                try {
                    const payload = { fullName };
                    if (newPassword) {
                        payload.currentPassword = currentPassword;
                        payload.newPassword = newPassword;
                    }

                    const updatedUser = await API.put('/auth/profile', payload);
                    Auth.setUser(updatedUser);
                    App.showToast('Profile updated successfully!', 'success');
                    document.getElementById('profile-display-name').textContent = updatedUser.fullName;
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                } catch (err) {
                    alertBox.textContent = err.message || 'Profile update failed.';
                    alertBox.classList.remove('d-none');
                } finally {
                    spinner.classList.add('d-none');
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
