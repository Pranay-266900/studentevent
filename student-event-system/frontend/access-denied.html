<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - CampusEventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="navbar-container"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container text-center">
            <div class="stat-icon bg-danger-subtle text-danger rounded-circle mx-auto mb-4" style="width: 80px; height: 80px;">
                <i class="bi bi-shield-x fs-1"></i>
            </div>
            <h1 class="display-5 fw-bold text-dark">403 - Access Denied</h1>
            <p class="lead text-muted mb-4 max-w-500 mx-auto">
                You do not have the required permissions or role privileges to view this page.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="index.html" class="btn btn-outline-secondary">Return Home</a>
                <a href="login.html" class="btn btn-primary">Switch Account</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center small text-muted">
            &copy; 2026 CampusEventHub - Student Event Registration & Participation System
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar();
        });
    </script>
</body>
</html>
