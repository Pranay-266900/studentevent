<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CampusEventHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <div class="stat-icon bg-primary text-white rounded-3 mx-auto mb-3" style="width: 54px; height: 54px;">
                                    <i class="bi bi-box-arrow-in-right fs-3"></i>
                                </div>
                                <h3 class="fw-bold mb-1">Welcome Back</h3>
                                <p class="text-muted small">Sign in to your campus event portal</p>
                            </div>

                            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" required placeholder="name@college.edu">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password" required placeholder="••••••••">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                    <label class="form-check-label small text-muted" for="rememberMe">
                                        Remember my session
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="submit-btn">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="login-spinner"></span>
                                    Sign In
                                </button>
                            </form>

                            <!-- Quick Demo Logins for Testing & Demonstration -->
                            <div class="mt-4 pt-3 border-top">
                                <div class="text-center mb-2">
                                    <span class="badge bg-secondary-subtle text-secondary small">Demo Quick Fill</span>
                                </div>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-sm btn-outline-danger text-start d-flex justify-content-between align-items-center"
                                            onclick="fillDemo('admin@college.edu', 'Admin@123')">
                                        <span><i class="bi bi-shield-lock me-1"></i> Administrator</span>
                                        <small class="text-muted">admin@college.edu</small>
                                    </button>
                                    <button class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center"
                                            onclick="fillDemo('sarah.jenkins@college.edu', 'Password@123')">
                                        <span><i class="bi bi-calendar-event me-1"></i> Organizer</span>
                                        <small class="text-muted">Dr. Sarah Jenkins</small>
                                    </button>
                                    <button class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center"
                                            onclick="fillDemo('alex.rivera@student.college.edu', 'Password@123')">
                                        <span><i class="bi bi-backpack4 me-1"></i> Student</span>
                                        <small class="text-muted">Alex Rivera</small>
                                    </button>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                <p class="text-muted small mb-0">Don't have an account?
                                    <a href="register.html" class="text-primary fw-semibold text-decoration-none">Create Account</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            &copy; 2026 CampusEventHub - Student Event Registration & Participation System
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.renderNavbar('login');

            // If already logged in, redirect to dashboard
            const existingUser = Auth.getUser();
            if (existingUser) {
                redirectUserByRole(existingUser.role);
            }

            // Password toggle
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
            });

            // Form Submit
            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const alertBox = document.getElementById('login-alert');
                alertBox.classList.add('d-none');

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                const spinner = document.getElementById('login-spinner');
                const submitBtn = document.getElementById('submit-btn');

                spinner.classList.remove('d-none');
                submitBtn.disabled = true;

                try {
                    const res = await API.post('/auth/login', { email, password });
                    if (res && res.user) {
                        Auth.setUser(res.user, rememberMe);
                        App.showToast(`Welcome back, ${res.user.fullName}!`, 'success');
                        redirectUserByRole(res.user.role);
                    }
                } catch (err) {
                    alertBox.textContent = err.message || 'Login failed. Please verify credentials.';
                    alertBox.classList.remove('d-none');
                } finally {
                    spinner.classList.add('d-none');
                    submitBtn.disabled = false;
                }
            });
        });

        function fillDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        function redirectUserByRole(role) {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            if (redirect && !redirect.includes('login') && !redirect.includes('register')) {
                window.location.href = redirect;
                return;
            }

            if (role === 'ADMIN') {
                window.location.href = 'admin-dashboard.html';
            } else if (role === 'ORGANIZER') {
                window.location.href = 'organizer-dashboard.html';
            } else {
                window.location.href = 'student-dashboard.html';
            }
        }
    </script>
</body>
</html>
