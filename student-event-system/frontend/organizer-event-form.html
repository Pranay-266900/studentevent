<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Form - CampusEventHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <main class="py-4">
        <div class="container-xl">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div>
                            <h2 class="fw-bold mb-1" id="form-heading">Create New College Event</h2>
                            <p class="text-muted mb-0">Fill in event details to publish to students across departments</p>
                        </div>
                        <a href="organizer-dashboard.html" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                        </a>
                    </div>

                    <div id="form-alert" class="alert alert-danger d-none" role="alert"></div>

                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <form id="event-form">
                                <div class="mb-3">
                                    <label for="title" class="form-label fw-semibold small">Event Title *</label>
                                    <input type="text" class="form-control" id="title" required maxlength="150"
                                           placeholder="e.g. Annual Autonomous Drone Challenge 2026">
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="category" class="form-label fw-semibold small">Category *</label>
                                        <select class="form-select" id="category" required>
                                            <option value="">Select Category...</option>
                                            <option value="Technical">Technical</option>
                                            <option value="Cultural">Cultural</option>
                                            <option value="Workshop">Workshop</option>
                                            <option value="Sports">Sports</option>
                                            <option value="Seminar">Seminar</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="eventDate" class="form-label fw-semibold small">Event Date *</label>
                                        <input type="date" class="form-control" id="eventDate" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="startTime" class="form-label fw-semibold small">Start Time *</label>
                                        <input type="time" class="form-control" id="startTime" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="endTime" class="form-label fw-semibold small">End Time *</label>
                                        <input type="time" class="form-control" id="endTime" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="venue" class="form-label fw-semibold small">Campus Venue *</label>
                                        <input type="text" class="form-control" id="venue" required maxlength="150"
                                               placeholder="e.g. Robotics Center / Auditorium">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="capacity" class="form-label fw-semibold small">Maximum Capacity *</label>
                                        <input type="number" class="form-control" id="capacity" required min="1"
                                               placeholder="e.g. 50">
                                    </div>
                                    <div class="col-md-3" id="status-group">
                                        <label for="status" class="form-label fw-semibold small">Event Status</label>
                                        <select class="form-select" id="status">
                                            <option value="UPCOMING">UPCOMING</option>
                                            <option value="ONGOING">ONGOING</option>
                                            <option value="COMPLETED">COMPLETED</option>
                                            <option value="CANCELLED">CANCELLED</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="description" class="form-label fw-semibold small">Detailed Description *</label>
                                    <textarea class="form-control" id="description" rows="5" required
                                              placeholder="Provide full schedule, participation guidelines, judging criteria, or speaker bios..."></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a href="organizer-dashboard.html" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-semibold" id="submit-btn">
                                        <span class="spinner-border spinner-border-sm d-none me-2" id="submit-spinner"></span>
                                        <span id="submit-text">Publish Event</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            &copy; 2026 CampusEventHub - Student Event Registration & Participation System
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        let eventId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth(['ORGANIZER', 'ADMIN'])) return;
            Auth.renderNavbar('organizer-event-form');

            const params = new URLSearchParams(window.location.search);
            eventId = params.get('id');

            // Set default date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('eventDate').min = new Date().toISOString().split('T')[0];
            document.getElementById('eventDate').value = tomorrow.toISOString().split('T')[0];
            document.getElementById('startTime').value = '10:00';
            document.getElementById('endTime').value = '16:00';

            if (eventId) {
                document.getElementById('form-heading').textContent = 'Edit College Event';
                document.getElementById('submit-text').textContent = 'Save Changes';
                await loadEventForEdit(eventId);
            }

            const form = document.getElementById('event-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                await handleSubmit();
            });
        });

        async function loadEventForEdit(id) {
            try {
                const ev = await API.get(`/events/${id}`);
                if (ev) {
                    document.getElementById('title').value = ev.title;
                    document.getElementById('category').value = ev.category;
                    document.getElementById('eventDate').value = ev.eventDate;
                    document.getElementById('startTime').value = ev.startTime;
                    document.getElementById('endTime').value = ev.endTime;
                    document.getElementById('venue').value = ev.venue;
                    document.getElementById('capacity').value = ev.capacity;
                    document.getElementById('status').value = ev.status;
                    document.getElementById('description').value = ev.description;
                }
            } catch (err) {
                App.showToast('Failed to load event data: ' + err.message, 'danger');
            }
        }

        async function handleSubmit() {
            const alertBox = document.getElementById('form-alert');
            alertBox.classList.add('d-none');

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const eventDate = document.getElementById('eventDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const venue = document.getElementById('venue').value.trim();
            const capacity = parseInt(document.getElementById('capacity').value, 10);
            const status = document.getElementById('status').value;
            const description = document.getElementById('description').value.trim();

            if (startTime >= endTime) {
                alertBox.textContent = 'Event Start Time must be before End Time.';
                alertBox.classList.remove('d-none');
                return;
            }

            const payload = {
                title,
                category,
                eventDate,
                startTime: startTime.length === 5 ? startTime + ':00' : startTime,
                endTime: endTime.length === 5 ? endTime + ':00' : endTime,
                venue,
                capacity,
                status,
                description
            };

            const spinner = document.getElementById('submit-spinner');
            const submitBtn = document.getElementById('submit-btn');
            spinner.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                if (eventId) {
                    await API.put(`/events/${eventId}`, payload);
                    App.showToast('Event updated successfully!', 'success');
                } else {
                    await API.post('/events', payload);
                    App.showToast('Event published successfully!', 'success');
                }
                setTimeout(() => {
                    window.location.href = 'organizer-dashboard.html';
                }, 700);
            } catch (err) {
                alertBox.textContent = err.message || 'Failed to save event.';
                alertBox.classList.remove('d-none');
            } finally {
                spinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
